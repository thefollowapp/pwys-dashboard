{% extends "base.html" %}
{% block title %}Log in · PWYS Dashboard{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16">
  <h1 class="text-xl font-semibold text-center mb-1">Play Where You Stay</h1>
  <p class="text-center text-slate-500 mb-6">Communications Dashboard</p>
  <div class="bg-white shadow rounded-lg p-6">
    {% if error %}
    <div class="bg-red-50 text-red-700 text-sm rounded p-3 mb-4">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" name="email" required autofocus
               class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" name="password" required
               class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600" />
      </div>
      <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white rounded px-3 py-2 font-medium">
        Log in
      </button>
    </form>
  </div>
</div>
{% endblock %}
