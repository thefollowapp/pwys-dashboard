<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PWYS Dashboard{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" href="data:,">
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  {% if user %}
  <header class="bg-emerald-800 text-white">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="font-semibold">Play Where You Stay &middot; Communications Dashboard</div>
      <nav class="flex items-center gap-4 text-sm">
        <a href="/dashboard" class="hover:underline">Dashboard</a>
        <a href="/account" class="hover:underline">Account</a>
        <span class="text-emerald-200">{{ user.name }}</span>
        <form method="post" action="/logout" class="inline">
          <button type="submit" class="bg-emerald-900 hover:bg-emerald-950 px-3 py-1 rounded">Log out</button>
        </form>
      </nav>
    </div>
  </header>
  {% endif %}
  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
