{% extends "base.html" %}
{% block title %}Account · PWYS Dashboard{% endblock %}
{% block content %}
<div class="max-w-sm">
  <h1 class="text-lg font-semibold mb-4">Change password</h1>
  <div class="bg-white shadow rounded-lg p-6">
    {% if error %}<div class="bg-red-50 text-red-700 text-sm rounded p-3 mb-4">{{ error }}</div>{% endif %}
    {% if success %}<div class="bg-emerald-50 text-emerald-700 text-sm rounded p-3 mb-4">{{ success }}</div>{% endif %}
    <form method="post" action="/account/password" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Current password</label>
        <input type="password" name="current_password" required
               class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">New password</label>
        <input type="password" name="new_password" required minlength="10"
               class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Confirm new password</label>
        <input type="password" name="confirm_password" required minlength="10"
               class="w-full border border-slate-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-600" />
      </div>
      <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white rounded px-3 py-2 font-medium">
        Update password
      </button>
    </form>
  </div>
</div>
{% endblock %}
